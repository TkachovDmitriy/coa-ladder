name: Refresh ladder data and deploy

on:
  schedule:
    # Daily at 00:00 UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Rolling day-over-day rating snapshots, not committed — see scripts/lib/history.utils.ts.
      - name: Restore ladder history cache
        uses: actions/cache@v6
        with:
          path: scripts/cache/history.json
          key: ladder-history-${{ github.run_id }}
          restore-keys: |
            ladder-history-

      # Runs outside a browser, so browser CORS policy does not apply here.
      - name: Refresh ladder data
        run: bun run data:refresh

      - name: Build static site
        run: bun run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
