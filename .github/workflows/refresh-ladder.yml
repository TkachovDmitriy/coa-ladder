name: Refresh ladder data and deploy

on:
  schedule:
    # Twice daily, 00:00 and 12:00 UTC.
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # History is durable on a data-only branch. The first run bootstraps it
      # from the legacy Actions cache when the branch does not exist yet.
      - name: Restore ladder history
        id: ladder-data
        run: |
          if git fetch origin ladder-data; then
            git show origin/ladder-data:history.json > scripts/cache/history.json
            if git cat-file -e origin/ladder-data:tracked-players.json 2>/dev/null; then
              git show origin/ladder-data:tracked-players.json > scripts/cache/tracked-players.json
            fi
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Migrate legacy history cache
        if: steps.ladder-data.outputs.exists == 'false'
        uses: actions/cache@v6
        with:
          path: scripts/cache/history.json
          key: ladder-history-migration-${{ github.run_id }}
          restore-keys: |
            ladder-history-

      # Runs outside a browser, so browser CORS policy does not apply here.
      - name: Refresh ladder data
        run: bun run data:refresh

      - name: Persist ladder data
        env:
          DATA_WORKTREE: /tmp/coa-ladder-data
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/ladder-data; then
            git worktree add --detach "$DATA_WORKTREE" origin/ladder-data
          else
            git worktree add --detach "$DATA_WORKTREE"
            git -C "$DATA_WORKTREE" switch --orphan ladder-data
          fi

          cp public/ladder.json "$DATA_WORKTREE/ladder.json"
          cp scripts/cache/history.json "$DATA_WORKTREE/history.json"
          cp scripts/cache/tracked-players.json "$DATA_WORKTREE/tracked-players.json"
          git -C "$DATA_WORKTREE" add ladder.json history.json tracked-players.json

          if git -C "$DATA_WORKTREE" diff --cached --quiet; then
            echo 'Ladder data is unchanged.'
          else
            git -C "$DATA_WORKTREE" config user.name github-actions[bot]
            git -C "$DATA_WORKTREE" config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git -C "$DATA_WORKTREE" commit -m "data: refresh ladder ${{ github.run_id }}"
            git -C "$DATA_WORKTREE" push origin HEAD:ladder-data
          fi

      - name: Build static site
        run: bun run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
