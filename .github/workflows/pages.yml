name: Refresh data and deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - public/ladder.json
      - scripts/cache/armory.json
  schedule:
    # Daily at 03:17 UTC (04:17/05:17 in Warsaw, depending on DST).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs outside a browser, so browser CORS policy does not apply here.
      - name: Refresh ladder data
        run: bun run data:refresh

      - name: Build static site
        run: bun run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
