name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A code-only deploy must use the durable data produced by the refresh
      # workflow. Fail instead of silently publishing the stale file on main.
      - name: Restore latest ladder data
        run: |
          git fetch origin ladder-data
          git show origin/ladder-data:ladder.json > public/ladder.json

      - name: Build static site
        run: bun run build
        env:
          VITE_TWITCH_STATUS_URL: ${{ vars.TWITCH_STATUS_URL }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
