name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # refresh-ladder.yml deploys directly without committing back, so the
      # git-tracked public/ladder.json is only a stale seed. Pull the latest
      # one that a refresh run cached, so a plain code push can't regress
      # live data to that stale committed copy.
      - name: Restore latest ladder data
        uses: actions/cache/restore@v6
        with:
          path: public/ladder.json
          key: ladder-json-${{ github.run_id }}
          restore-keys: |
            ladder-json-

      - name: Build static site
        run: bun run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
